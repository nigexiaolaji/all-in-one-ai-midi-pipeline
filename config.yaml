# config.yaml — GPU 满血版（ModelScope Notebook）
# CPU 环境也兼容，自动降级参数

separation:
  model: htdemucs_6s
  out_dir: data/stems
  # GPU 自动使用 shifts=5 segment=7.8 overlap=0.25（最高质量）
  # CPU 自动降级为 shifts=1 segment=4 overlap=0.1（速度优先）

meter_key:
  meter_conf_threshold: 0.58
  key_conf_threshold: 0.55

transcription:
  basic_pitch_threshold_cents: 30
  drum_quantize_strength: 0.35

cleanup:
  max_quantize_ms: 25
  min_note_ms: 50

# default output tracks (can be overridden by --tracks)
tracks:
  - drums
  - bass
  - guitar
  - other
  - voxlead
  - voxbg
